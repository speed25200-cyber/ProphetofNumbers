# Prophet — XcodeGen (source of truth).
# Generate:  xcodegen generate
# Codemagic runs this before resolve/build.

name: Prophet
options:
  bundleIdPrefix: com.prophetofnumbers
  developmentLanguage: fr
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_ENABLE_EXPLICIT_MODULES: NO
    CLANG_ENABLE_EXPLICIT_MODULES: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "BTMRPS8F79"

targets:
  Prophet:
    type: application
    platform: iOS
    sources:
      - path: Prophet
        excludes:
          - "**/*.md"
          - "Resources/Info.plist"
    resources:
      - Prophet/Resources/Assets.xcassets
      - Prophet/Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prophetofnumbers.app
        PRODUCT_NAME: Prophet
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Prophet/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Prophet/Prophet.entitlements

  ProphetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ProphetTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prophetofnumbers.app.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Prophet

schemes:
  Prophet:
    build:
      targets:
        Prophet: all
        ProphetTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ProphetTests
    profile:
      config: Release
    archive:
      config: Release
